<!--
  Čitanje na bini: dve kartice, „Na bini“ (gore, izlazak koji se penje i prima zahvalnice) i „Neka se spreme“ (dole,
  sledeći izlazak), i jedno dugme. Izlaske pravi server (scripts/zahvalnice/server/Bina.js) od gostiju koji su stigli i primaju
  zahvalnicu; stanje je na serveru, pa svi telefoni vide isto. Prijava je ista kao u skeneru (nova/).
  Radnja se prikaže odmah (predviđanje), a šalje se redom u pozadini; kad server odbije, ekran se vrati na njegovo stanje.
  Animacija prati radnju (napred, nazad); izmena sa drugog telefona se samo pretopi.
  Izvor: scripts/zahvalnice/citanje/ u privatnom repozitorijumu.
-->

<style>
  :root {
    --pozadina: #f8b6ba;   /* Corinthian Pink */
    --povrs: #ffffff;
    --tekst: #7d133a;      /* Pansy Purple */
    --tekst2: #713b4c;     /* Violet Carmine */
    --linija: #e0b3b6;     /* Cameo Pink */
    --akcent: #a62c37;     /* Carmine Red */
    --na-akcentu: #ffffff;
    --ok: #1a7444;         /* Diamine Green */
    --lose: #a62c37;
    --upozorenje: #ae5224; /* Burnt Sienna */
    --senka: 0 2px 6px rgba(125, 19, 58, .14);
    --dno: env(safe-area-inset-bottom, 0px); --vrh: env(safe-area-inset-top, 0px);
    --glatko: cubic-bezier(.22, 1, .36, 1);
    --naslovni: "Space Grotesk", system-ui, sans-serif;
    --telo: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --pozadina: #7d133a; --povrs: #a72144; --tekst: #f5ecc2; --tekst2: #fdd4bd; --linija: #501345;
      --akcent: #f5ecc2; --na-akcentu: #7d133a; --ok: #2f9e60; --lose: #ffb4a8; --senka: none; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, button, label { touch-action: manipulation; }
  html, body { margin: 0; height: 100%; background: var(--pozadina); color: var(--tekst); font-family: var(--telo); font-size: 17px; }
  h1, h2 { font-family: var(--naslovni); }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; transition: transform .15s var(--glatko), opacity .2s; }
  button:active { transform: scale(.96); }
  .skriveno { display: none !important; }
  .ekran { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 640px;
    margin: 0 auto; padding: calc(var(--vrh) + 10px) 16px calc(var(--dno) + 12px); }

  /* Vrh: gde smo, šta se upravo dešava, odjava */
  .vrh { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 15px; color: var(--tekst2); font-weight: 600; flex: none; }
  .vrh b { color: var(--tekst); }
  /* šta se upravo dešava: desno u istom redu, sme u dva reda, da ništa ne skače */
  #status { font-size: 14px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-height: 20px; min-width: 0; text-align: right; color: var(--tekst2); }
  #status.lose { color: var(--lose); font-weight: 700; }
  #status.pazi { color: var(--upozorenje); font-weight: 700; }
  @media (prefers-color-scheme: dark) { #status.pazi { color: #ffd0a8; } }
  .vrti { width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: vrti .7s linear infinite; }
  @keyframes vrti { to { transform: rotate(360deg); } }
  /* Nalog i odjava: isto kao u skeneru (nova/index.html, .nalogred) */
  .nalogred { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none; }
  .nalogred .mejl { min-width: 0; font-size: 15px; color: var(--tekst2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .odjava { flex: none; padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--linija); background: var(--povrs);
    color: var(--tekst); font-size: 14px; font-weight: 600; }

  .kartica { background: var(--povrs); border-radius: 18px; box-shadow: var(--senka); padding: 14px 16px; display: flex; flex-direction: column;
    min-height: 0; min-width: 0; overflow: hidden; }
  #gore, #dole { flex: 1 1 0; }
  #dole { cursor: pointer; }
  /* Uvećana kartica: druga se sklanja, slova su veća; dugmad dole ostaju */
  .uvecaj { flex: none; width: 36px; height: 36px; margin: -6px -6px 0 0; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    background: transparent; color: var(--tekst2); }
  .uvecaj svg { width: 22px; height: 22px; }
  .ekran.uvecano .kartica:not(.uvecana) { display: none; }
  .kartica.uvecana { animation: izlazi .28s var(--glatko) both; }
  @keyframes izlazi { from { transform: scale(.94); opacity: .6; } }
  .uvecana .grupa .naziv, #dole.uvecana .grupa .naziv { font-size: 34px; }
  .uvecana .grupa .mesto { font-size: 19px; }
  .uvecana .imena, #dole.uvecana .imena { font-size: 27px; line-height: 1.4; color: var(--tekst); }
  /* imena se skroluju unutar kartice, a kućica „Primili su“ uvek stoji na dnu */
  .sadrzaj { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; overflow-wrap: anywhere; }
  .oznaka { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--naslovni); font-weight: 700;
    font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--tekst2); margin-bottom: 6px; flex: none; }
  .oznaka .koliko { flex: 1; text-align: right; white-space: nowrap; letter-spacing: 0; text-transform: none; font-family: var(--telo); font-weight: 600; }
  .grupa { padding: 6px 0; border-top: 1px solid var(--linija); }
  .grupa:first-child { border-top: 0; }
  .grupa .naziv { font-family: var(--naslovni); font-weight: 700; font-size: 24px; line-height: 1.15; }
  .grupa .mesto { font-size: 15px; color: var(--tekst2); margin-top: 1px; }
  .imena { margin: 4px 0 2px; padding: 0; list-style: none; font-size: 18px; line-height: 1.45; }
  #dole .grupa .naziv { font-size: 20px; }
  #dole .imena { font-size: 15px; color: var(--tekst2); }
  .prazno { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
    color: var(--tekst2); font-size: 17px; line-height: 1.45; padding: 10px; }
  .prazno b { color: var(--tekst); }
  .prazno .glavni { display: block; color: var(--tekst); font-weight: 700; font-size: 19px; margin-bottom: 6px; }
  .osvezava { opacity: .45; transition: opacity .2s; }

  .primili { position: relative; flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 4px 2px;
    border-top: 1.5px solid var(--linija); font-weight: 700; font-size: 18px; cursor: pointer; }
  .primili input { width: 30px; height: 30px; accent-color: var(--ok); flex: none; margin: 0; }
  .primili.trazi { animation: puls .45s ease-in-out 3; }
  @keyframes puls { 50% { background: rgba(174, 82, 36, .28); border-radius: 12px; } }
  .oblacic { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); background: var(--upozorenje); color: #fff; font-weight: 700;
    font-size: 15px; padding: 9px 12px; border-radius: 10px; animation: pojava .2s var(--glatko) both; }
  .oblacic::after { content: ""; position: absolute; left: 22px; top: 100%; border: 7px solid transparent; border-top-color: var(--upozorenje); }

  /* Animacije: radnja (napred: sadržaj dolazi odozdo, kao da se izlazak penje; nazad: odozgo), stanje sa drugog telefona: pretapanje */
  .napred { animation: odozdo .34s var(--glatko) both; }
  .nazad-a { animation: odozgo .34s var(--glatko) both; }
  .promena { animation: pojava .3s ease both; }
  @keyframes odozdo { from { opacity: 0; transform: translateY(26px); } }
  @keyframes odozgo { from { opacity: 0; transform: translateY(-26px); } }
  @keyframes pojava { from { opacity: 0; } }
  .trese { animation: trese .35s; }
  @keyframes trese { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .napred, .nazad-a, .promena, .trese, .primili.trazi { animation: none; } }

  .dugmad { display: flex; gap: 10px; flex: none; }
  .dugme { border-radius: 16px; padding: 18px 14px; font-weight: 800; font-size: 20px; font-family: var(--naslovni); letter-spacing: .04em; }
  .glavno { flex: 1; background: var(--akcent); color: var(--na-akcentu); }
  .glavno.ceka { background: var(--povrs); color: var(--tekst2); border: 1.5px dashed var(--linija); font-size: 17px; }
  .nazad { flex: none; width: 64px; background: var(--povrs); border: 1.5px solid var(--linija); font-size: 24px; }
  .nazad:disabled { opacity: .35; }
  /* Podešavanja: dugme sa ikonicom i trenutnim stanjem u vrhu; menja se u prozoru */
  .podesavanja { display: flex; align-items: center; gap: 7px; padding: 6px 12px 6px 9px; margin-left: -9px; border-radius: 999px;
    background: var(--povrs); border: 1.5px solid var(--linija); color: var(--tekst2); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .podesavanja svg { width: 18px; height: 18px; flex: none; }
  /* Polje podešavanja: naziv levo, broj sa − i + desno, opis ispod; sve poravnato uz levu ivicu kao naslov */
  .polje { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 14px; padding: 4px 0 6px; }
  .polje-naziv { font-weight: 700; line-height: 1.3; }
  .polje-opis { grid-column: 1 / -1; font-size: 14px; color: var(--tekst2); line-height: 1.4; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 44px; height: 44px; border-radius: 50%; background: var(--povrs); border: 1.5px solid var(--linija); font-size: 26px; font-weight: 700; }
  .stepper button:disabled { opacity: .35; }
  .stepper b { font-family: var(--naslovni); font-size: 28px; min-width: 2ch; text-align: center; }

  .prijava { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; text-align: center; }
  .prijava h1 { margin: 0; font-size: 28px; }
  .prijava p { margin: 0; color: var(--tekst2); line-height: 1.45; max-width: 34ch; }
  .prijava .dugme { flex: none; padding: 14px 28px; font-size: 18px; }
  .prijava .poruka { font-size: 15px; color: var(--lose); min-height: 20px; }
  .ucitava { display: flex; align-items: center; gap: 10px; color: var(--tekst2); font-weight: 700; font-size: 17px; }
  .ucitava .vrti { width: 20px; height: 20px; border-width: 2.5px; }
  .prozor { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; animation: pojava .15s both; }
  .prozor-kartica { background: var(--povrs); border-radius: 20px; padding: 20px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .prozor-kartica h2 { margin: 0; font-size: 22px; }
  .prozor-kartica p { margin: 0; line-height: 1.45; color: var(--tekst2); }
  #prozor-dugmad { display: flex; flex-direction: column; gap: 8px; }
  .prozor-kartica .dugme { width: 100%; }
  .obicno { background: transparent; border: 1.5px solid var(--linija); }
</style>
</head>

  <div class="vrh"><button class="podesavanja" id="podesavanja" aria-label="Podešavanja"><svg><use href="#i-podesi"/></svg><span id="izlazak-od"></span></button><span id="status" role="status" aria-live="polite"></span></div>

<script>
  const CLIENT_ID = '908081565472-pj7sujfd1tsjrquu9aibvduc20trc7cj.apps.googleusercontent.com';
  const SERVER = 'https://script.google.com/macros/s/AKfycbxS0Yg3IuKoIsEtb6NN7RxHoa3wtHu02Pzms352MdfJn0iRzdNTjfVuOCzQiUBM60u70A/exec';
  const DOZVOLE = ['https://www.googleapis.com/auth/userinfo.email'];
  // Objekat biračkog mesta (kontrolna lista BM), drugi red ispod naziva grupe; u gradu je naziv već objekat
  const OBJEKAT = {"1":"Osnovna škola","2":"Osnovna škola","3":"Osnovna škola","4":"Osnovna škola","5":"Osnovna škola","6":"Osnovna škola","7":"Osnovna škola","8":"Dom kulture","9":"Osnovna škola","10":"Dom kulture","11":"Dom kulture","12":"Dom kulture","13":"Osnovna škola","14":"Dom kulture","15":"Osnovna škola","16":"Dom kulture","17":"Dom kulture","18":"Dom kulture","19":"Dom kulture","20":"Mesna zajednica","21":"Mesna zajednica","22":"Mesna zajednica","23":"Dom kulture","24":"Privatna kuća","25":"Osnovna škola","26":"Osnovna škola","27":"Dom kulture","28":"Osnovna škola","29":"Privatna kuća","30":"Osnovna škola","31":"Dom kulture","32":"Osnovna škola","33":"Dom kulture","34":"Osnovna škola","35":"Osnovna škola","36":"Osnovna škola","37":"Osnovna škola","38":"Crkvena kuća","39":"Osnovna škola","40":"Osnovna škola","41":"Osnovna škola","42":"Osnovna škola","43":"Dom kulture","44":"Osnovna škola","45":"Osnovna škola","46":"Dom kulture","47":"Dom kulture","48":"Osnovna škola","49":"Osnovna škola","50":"Dom kulture","51":"Osnovna škola","52":"Dom kulture","53":"Osnovna škola","54":"Aleksinac","55":"Aleksinac","56":"Aleksinac","57":"Aleksinac","58":"Aleksinac","59":"Aleksinac","60":"Aleksinac","61":"Aleksinac","62":"Aleksinac","63":"Aleksinac","64":"Aleksinac","65":"Aleksinac","66":"Aleksinac","67":"Aleksinac","68":"Aleksinac","69":"Aleksinac","70":"Aleksinac","71":"Aleksinac","72":"Dom kulture","73":"Dom kulture","74":"Dom kulture","75":"Osnovna škola","76":"Dom kulture","77":"Osnovna škola","78":"Osnovna škola","79":"Osnovna škola","80":"Dom kulture","81":"Osnovna škola","82":"Dom kulture","83":"Dom kulture","84":"Osnovna škola","85":"Osnovna škola","86":"Dom kulture","87":"Osnovna škola","88":"Osnovna škola"};

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cuvaj = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const citaj = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };

  // ---------- Prijava (isti ključ kao skener: ko je prijavljen u skeneru, prijavljen je i ovde) ----------
  let token = null, tokenDo = 0, mejl = '', klijent = null;
  const sacuvan = citaj('nova-token');
  if (sacuvan && sacuvan.do > Date.now() + 60000) { token = sacuvan.token; tokenDo = sacuvan.do; mejl = sacuvan.mejl || ''; }
  else mejl = (sacuvan && sacuvan.mejl) || '';

  function traziToken() {
    return new Promise((da, ne) => {
      if (!window.google || !google.accounts) return ne(new Error('Google prijava se još učitava, pokušajte za par sekundi.'));
      klijent = klijent || google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: DOZVOLE.join(' '), callback: () => {} });
      klijent.callback = (o) => {
        if (o.error) return ne(new Error('Prijava nije uspela (' + o.error + ').'));
        token = o.access_token; tokenDo = Date.now() + (Number(o.expires_in) - 60) * 1000;
        cuvaj('nova-token', { token, do: tokenDo, mejl });
        da();
      };
      klijent.error_callback = (e) => ne(new Error('Prijava je prekinuta (' + e.type + ').'));
      klijent.requestAccessToken({ prompt: mejl ? '' : 'select_account', hint: mejl || undefined });
    });
  }
  function istekla(t) { const e = new Error(t); e.istekla = true; return e; }
  async function server(akcija, podaci) {
    if (!token || Date.now() > tokenDo) throw istekla('Prijava je istekla, prijavite se ponovo.');
    let r;
    try {
      r = await fetch(SERVER, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ akcija, token }, podaci || {})) });
    } catch (e) { throw new Error('nema veze sa serverom'); }
    const o = await r.json();
    if (o.greska === 'prijava') { token = null; tokenDo = 0; cuvaj('nova-token', { mejl }); throw istekla('Prijava je istekla, prijavite se ponovo.'); }
    if (o.greska === 'pristup') throw istekla('Nalog ' + (o.mejl || '') + ' nema pristup. Javite štabu da ga upiše na list Skeneri.');
    if (o.greska === 'server') throw new Error(o.poruka || 'greška na serveru');
    if (o.sesija) { token = o.sesija; tokenDo = Date.now() + (Number(o.sesijaTraje) - 60) * 1000; mejl = o.mejl || mejl; cuvaj('nova-token', { token, do: tokenDo, mejl }); }
    return o;
  }

  // ---------- Stanje ----------
  // srv: poslednje stanje sa servera; vidi: ono što je na ekranu (srv + radnje koje čekaju); red: radnje koje čekaju server.
  let srv = null, vidi = null, verzija = 0, doleImena = false, uvecana = '';  // uvecana: '', 'gore' ili 'dole'
  const red = [];
  const CEKA = 'ceka';  // izlazak koji server tek šalje (posle Dalje / Nazad)

  // Šta radnja menja na ekranu odmah; null = radnja sad nema smisla (ne šalje se)
  const PREDVIDI = {
    'bina-pocni': (b) => (b.dole ? Object.assign({}, b, { pocelo: true }) : null),
    'bina-dalje': (b) => Object.assign({}, b, { p: b.p + 1, gore: b.dole, dole: b.dole ? CEKA : null, primili: false }),
    'bina-nazad': (b) => (b.p === 0 ? Object.assign({}, b, { pocelo: false })
      : Object.assign({}, b, { p: b.p - 1, dole: b.gore, gore: b.p >= 2 ? CEKA : null, primili: true })),
    'bina-primili': (b, v) => Object.assign({}, b, { primili: v }),
    'bina-n': (b, v) => Object.assign({}, b, { n: v }),
  };
  const ANIMACIJA = { 'bina-dalje': 'napred', 'bina-pocni': 'napred', 'bina-nazad': 'nazad-a' };

  function radnja(a, v) {
    const pre = vidi;
    const posle = PREDVIDI[a](pre, v);
    if (!posle) return false;
    red.push({ a, v, p: pre.p });
    vidi = posle;
    crtaj(ANIMACIJA[a]);
    obradi();
    return true;
  }
  let obradjuje = false;
  async function obradi() {
    if (obradjuje) return;
    obradjuje = true;
    while (red.length) {
      status('Šaljem…', 'radi');
      const r = red[0];
      try {
        const o = await server(r.a, { p: r.p, vrednost: r.v });
        red.shift();
        srv = o.bina; verzija = o.verzija || verzija;
        if (o.greska) {
          red.length = 0;  // server je odbio: ostale radnje su predviđene na pogrešnom stanju
          vidi = srv; crtaj('promena');
          objasni(o.greska);
        } else {
          vidi = red.reduce((b, x) => PREDVIDI[x.a](b, x.v) || b, srv);
          crtaj('promena');  // pretapa samo ono što je server tek poslao (sledeći izlazak umesto „Pravim…“)
          if (!red.length) status('✓ Sačuvano', 'ok');
        }
      } catch (e) {
        red.length = 0;
        if (e.istekla) { obradjuje = false; return prikaziPrijavu(e.message); }
        vidi = srv; crtaj('promena');
        status('Nije sačuvano (' + e.message + '), vraćeno. Pokušajte ponovo.', 'lose');
      }
    }
    obradjuje = false;
  }
  function objasni(g) {
    const t = { promenjeno: 'Drugi telefon je upravo pomerio izlaske; prikazano je trenutno stanje.', primili: 'Prvo označite da su primili zahvalnice.',
      prazno: 'Još niko nije stigao ko prima zahvalnicu.', kraj: 'Nema više izlazaka.' }[g] || g;
    status(t, 'pazi');
    if (g === 'primili') trazi();
  }

  // Status u vrhu: šta se upravo dešava. Potvrda nestaje posle 2 s, greška ostaje dok sledeća radnja ne uspe.
  let statusTajmer = null;
  function status(t, vrsta) {
    clearTimeout(statusTajmer);
    const s = $('status');
    s.className = vrsta === 'lose' || vrsta === 'pazi' ? vrsta : '';
    s.innerHTML = (vrsta === 'radi' ? '<span class="vrti"></span>' : '') + esc(t);
    if (vrsta === 'ok') statusTajmer = setTimeout(() => (s.textContent = ''), 2000);
    if (vrsta === 'pazi') statusTajmer = setTimeout(() => (s.textContent = ''), 6000);
  }

  // ---------- Crtanje ----------
  const naziv = (g) => g || 'Kontrolori bez BM';
  const izlazaka = (n) => (n % 10 === 1 && n % 100 !== 11 ? 'izlazak' : 'izlazaka');
  const mesto = (g) => { const m = /^BM (\d+)/.exec(g); return m ? OBJEKAT[Number(m[1])] || '' : ''; };
  const ucitava = (t) => '<div class="prazno"><span class="vrti"></span><span>' + t + '</span></div>';
  const prazno = (t) => '<div class="prazno"><div>' + t + '</div></div>';
  function izlazak(t, imena) {
    return '<div class="sadrzaj">' + t.grupe.map((g) => '<div class="grupa"><div class="naziv">' + esc(naziv(g.naziv)) + '</div>'
      + (mesto(g.naziv) ? '<div class="mesto">' + esc(mesto(g.naziv)) + '</div>' : '')
      + (imena ? '<ul class="imena">' + g.ljudi.map((x) => '<li>' + esc(x.ime) + '</li>').join('') + '</ul>' : '') + '</div>').join('') + '</div>';
  }
  const dugmeUvecaj = (k) => '<button class="uvecaj" data-uvecaj="' + k + '" aria-label="' + (uvecana === k ? 'Umanji' : 'Uvećaj') + ' karticu">'
    + '<svg><use href="#i-' + (uvecana === k ? 'umanji' : 'uvecaj') + '"/></svg></button>';
  function htmlGore(b) {
    const g = b.gore;
    const oznaka = '<div class="oznaka"><span>Na bini</span>' + (g && g !== CEKA ? '<span class="koliko">izlazak ' + g.redni + ' · ' + g.ljudi + ' ljudi</span>' : '') + dugmeUvecaj('gore') + '</div>';
    if (g === CEKA) return oznaka + ucitava('Vraćam prethodni izlazak…');
    if (!g) return oznaka + prazno(!b.pocelo ? 'Kada pritisnete <b>Počni</b>, prvi izlazak se poziva da se spremi, a sledeće <b>Dalje</b> ga izvodi na binu.'
      : b.dole ? '<span class="glavni">Niko nije na bini.</span>Pročitajte izlazak dole da se spremi, pa <b>Dalje</b> ga izvodi na binu.'
      : '<span class="glavni">Gotovo.</span>Svi koji su stigli su prozvani.');
    return oznaka + izlazak(g, true) + '<label class="primili" id="primili-red"><input type="checkbox" id="primili"' + (b.primili ? ' checked' : '') + '> Primili su zahvalnice</label>';
  }
  function htmlDole(b) {
    const d = b.dole;
    const imena = doleImena || uvecana === 'dole';
    const oznaka = '<div class="oznaka"><span>' + (b.pocelo ? 'Neka se spreme' : 'Prvi izlazak') + '</span>'
      + (d && d !== CEKA ? '<span class="koliko">izlazak ' + d.redni + ' · ' + d.ljudi + ' ljudi' + (uvecana === 'dole' ? '' : ' ' + (doleImena ? '▴' : '▾')) + '</span>' : '')
      + dugmeUvecaj('dole') + '</div>';
    if (d === CEKA) return oznaka + ucitava('Pravim sledeći izlazak…');
    if (!d) return oznaka + prazno(b.pocelo ? (b.gore ? 'Gore je poslednji izlazak. Ko zakasni, pojaviće se ovde.' : 'Nema više nikoga ko je stigao, a nije prozvan.')
      : '<span class="glavni">Još niko nije stigao ko prima zahvalnicu.</span>Izlasci se prave od gostiju skeniranih na ulazu i pojaviće se ovde čim neko stigne.');
    return oznaka + izlazak(d, imena);
  }
  // Kartica se menja samo kad joj se promeni sadržaj (ne gubi skrol), uz animaciju radnje ili pretapanje
  function postavi(el, html, anim) {
    if (el.dataset.html === html) return;
    el.dataset.html = html;
    el.innerHTML = html;
    const sd = el.querySelector('.sadrzaj');
    if (sd) sd.scrollTop = 0;
    if (anim) { el.classList.remove('napred', 'nazad-a', 'promena'); void el.offsetWidth; el.classList.add(anim); }
  }
  function crtaj(anim) {
    const b = vidi;
    $('nalog').textContent = mejl;
    $('ekran-rad').classList.toggle('uvecano', !!uvecana);
    $('gore').classList.toggle('uvecana', uvecana === 'gore');
    $('dole').classList.toggle('uvecana', uvecana === 'dole');
    $('izlazak-od').innerHTML = (!b.pocelo ? '<b>' + b.ukupno + '</b> ' + izlazaka(b.ukupno) + ' · ' + b.preostalo + ' ljudi'
      : b.p === 0 ? 'Sprema se izlazak <b>1</b> od ' + b.ukupno : 'Na bini izlazak <b>' + b.p + '</b> od ' + b.ukupno) + ' · do ' + b.n;
    postavi($('gore'), htmlGore(b), anim);
    postavi($('dole'), htmlDole(b), anim);
    const gl = $('glavno');
    const ceka = !b.pocelo && !b.dole;
    gl.textContent = !b.pocelo ? (b.dole ? 'POČNI' : 'ČEKA SE PRVI GOST') : !b.gore && !b.dole ? 'GOTOVO' : 'DALJE ›';
    gl.classList.toggle('ceka', ceka || (b.pocelo && !b.gore && !b.dole));
    $('nazad').disabled = !b.pocelo;
  }

  // ---------- Radnje ----------
  function trazi() {
    const r = $('primili-red');
    if (!r) return;
    r.classList.remove('trazi'); void r.offsetWidth; r.classList.add('trazi');
    if (!r.querySelector('.oblacic')) r.insertAdjacentHTML('beforeend', '<div class="oblacic">Prvo označite da su primili zahvalnice.</div>');
  }
  function trese(el) { el.classList.remove('trese'); void el.offsetWidth; el.classList.add('trese'); }
  $('glavno').addEventListener('click', () => {
    const b = vidi;
    if (!b) return;
    if (!b.pocelo) { if (!radnja('bina-pocni')) { trese($('glavno')); status('Još niko nije stigao ko prima zahvalnicu.', 'pazi'); } return; }
    if (b.gore === CEKA || b.dole === CEKA) return status('Sačekajte, server još šalje izlazak…', 'radi');
    if (b.gore && !b.primili) return trazi();
    if (!b.gore && !b.dole) { trese($('glavno')); return status('Nema više izlazaka.', 'pazi'); }
    radnja('bina-dalje');
  });
  $('gore').addEventListener('change', (e) => { if (e.target.id === 'primili') radnja('bina-primili', e.target.checked); });
  document.addEventListener('click', (e) => {
    const u = e.target.closest('[data-uvecaj]');
    if (u) { uvecana = uvecana === u.dataset.uvecaj ? '' : u.dataset.uvecaj; return crtaj(); }
    if (e.target.closest('#dole') && uvecana !== 'dole') { doleImena = !doleImena; crtaj(); }
  });
  $('nazad').addEventListener('click', () => {
    const b = vidi;
    if (!b || !b.pocelo || b.gore === CEKA || b.dole === CEKA) return;
    const g = b.gore;
    prozor('Vratiti jedan korak?', g ? 'Izlazak ' + g.redni + ' se vraća u „Neka se spreme“' + (b.p >= 2 ? ', a izlazak ' + (g.redni - 1) + ' ponovo na binu.' : '.')
      : 'Prvi izlazak se vraća, kao da niste počeli.', [{ tekst: 'Vrati', glavno: true, akcija: () => radnja('bina-nazad') }, { tekst: 'Otkaži' }]);
  });
  // Podešavanja u prozoru: menja se samo u prozoru, a čuva (šalje serveru) tek na Sačuvaj
  const N_MIN = 4, N_MAX = 40;
  function podesavanja() {
    let n = vidi.n;
    const crtajN = () => { $('pn').textContent = n; $('pn-manje').disabled = n <= N_MIN; $('pn-vise').disabled = n >= N_MAX; };
    prozor('Podešavanja', '', [{ tekst: 'Sačuvaj', glavno: true, akcija: () => { if (n !== vidi.n) radnja('bina-n', n); } }, { tekst: 'Otkaži' }],
      '<div class="polje"><div class="polje-naziv">Najviše ljudi u jednom izlasku</div>'
      + '<div class="stepper"><button id="pn-manje" aria-label="Manje">−</button><b id="pn"></b><button id="pn-vise" aria-label="Više">+</button></div>'
      + '<div class="polje-opis">Važi za izlaske koji još nisu prozvani. Grupe se slažu dok staju, a veća grupa se deli na jednake delove.</div></div>');
    $('pn-manje').addEventListener('click', () => { n = Math.max(N_MIN, n - 1); crtajN(); });
    $('pn-vise').addEventListener('click', () => { n = Math.min(N_MAX, n + 1); crtajN(); });
    crtajN();
  }
  $('podesavanja').addEventListener('click', () => vidi && podesavanja());

  function prozor(naslov, tekst, dugmad, telo) {
    $('prozor-naslov').textContent = naslov;
    $('prozor-tekst').innerHTML = esc(tekst);
    $('prozor-tekst').classList.toggle('skriveno', !tekst);
    $('prozor-telo').innerHTML = telo || '';
    $('prozor-dugmad').innerHTML = '';
    dugmad.forEach((d) => {
      const b = document.createElement('button');
      b.className = 'dugme ' + (d.glavno ? 'glavno' : 'obicno');
      b.textContent = d.tekst;
      b.addEventListener('click', () => { $('prozor').classList.add('skriveno'); if (d.akcija) d.akcija(); });
      $('prozor-dugmad').appendChild(b);
    });
    $('prozor').classList.remove('skriveno');
  }
  $('prozor').addEventListener('click', (e) => { if (e.target === $('prozor')) $('prozor').classList.add('skriveno'); });

  // Na 2 s pita samo verziju; kad se promeni (skeniranje, drugi telefon), čita izlaske. Dok radnje čekaju, ne dira ekran.
  let pratim = null;
  async function prati() {
    if (red.length || obradjuje || document.hidden) return;
    try {
      const o = await server('verzija');
      if (o.verzija === verzija) return;
      const b = await server('bina');
      if (red.length || obradjuje) return;
      const pomereno = b.bina.p !== srv.p || b.bina.pocelo !== srv.pocelo;
      srv = vidi = b.bina; verzija = b.verzija;
      crtaj(pomereno ? 'promena' : null);
      if (pomereno) status('Drugi telefon je pomerio izlaske.', 'pazi');
    } catch (e) {
      if (e.istekla) return prikaziPrijavu(e.message);
      status('Nema veze sa serverom, pokušavam ponovo…', 'lose');
    }
  }

  // Jedan ekran u svakom trenutku: učitavanje (bez dugmadi), prijava ili rad
  function ekran(ime) { ['ucitava', 'prijava', 'rad'].forEach((x) => $('ekran-' + x).classList.toggle('skriveno', x !== ime)); }
  function prikaziPrijavu(t) {
    clearInterval(pratim);
    ekran('prijava');
    $('prijava-poruka').textContent = t || '';
  }
  async function pocni() {
    ekran('ucitava');
    try {
      const o = await server('bina');
      srv = vidi = o.bina; verzija = o.verzija;
      ekran('rad');
      crtaj('promena');
      clearInterval(pratim);
      pratim = setInterval(prati, 2000);
    } catch (e) { prikaziPrijavu(e.message); }
  }
  $('prijavi').addEventListener('click', () => traziToken().then(pocni).catch((e) => ($('prijava-poruka').textContent = e.message)));
  $('odjava').addEventListener('click', () => prozor('Odjaviti se?', 'Prijava se briše sa ovog telefona (i u aplikaciji za ulaz, ista je).',
    [{ tekst: 'Odjavi se', glavno: true, akcija: () => { token = null; tokenDo = 0; cuvaj('nova-token', { mejl }); prikaziPrijavu(''); } }, { tekst: 'Otkaži' }]));
  if (token) pocni(); else ekran('prijava');
</script>
</body>
</html>
