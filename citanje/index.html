<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8b6ba" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#7d133a" media="(prefers-color-scheme: dark)">
<title>Dodela zahvalnica – čitanje</title>
<!--
  Čitanje na bini: dve kartice, „Na binu“ (gore, tura koja se penje i prima zahvalnice) i „Neka se spreme“ (dole,
  sledeća tura), i jedno dugme Dalje. Ture pravi server (scripts/zahvalnice/server/Bina.js) od gostiju koji su stigli
  i primaju zahvalnicu, a stanje je na serveru, pa svi telefoni vide isto. Prijava je ista kao u skeneru (nova/).
  Izvor: scripts/zahvalnice/citanje/ u privatnom repozitorijumu.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  :root {
    --pozadina: #f8b6ba;   /* Corinthian Pink */
    --povrs: #ffffff;
    --tekst: #7d133a;      /* Pansy Purple */
    --tekst2: #713b4c;     /* Violet Carmine */
    --linija: #e0b3b6;     /* Cameo Pink */
    --akcent: #a62c37;     /* Carmine Red */
    --na-akcentu: #ffffff;
    --ok: #1a7444;         /* Diamine Green */
    --upozorenje: #ae5224; /* Burnt Sienna */
    --senka: 0 2px 6px rgba(125, 19, 58, .14);
    --dno: env(safe-area-inset-bottom, 0px); --vrh: env(safe-area-inset-top, 0px);
    --naslovni: "Space Grotesk", system-ui, sans-serif;
    --telo: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --pozadina: #7d133a; --povrs: #a72144; --tekst: #f5ecc2; --tekst2: #fdd4bd; --linija: #501345;
      --akcent: #f5ecc2; --na-akcentu: #7d133a; --ok: #2f9e60; --senka: none; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, button, label { touch-action: manipulation; }
  html, body { margin: 0; height: 100%; background: var(--pozadina); color: var(--tekst); font-family: var(--telo); font-size: 17px; }
  h1, h2, .naslov { font-family: var(--naslovni); }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; transition: transform .15s; }
  button:active { transform: scale(.97); }
  .skriveno { display: none !important; }
  .ekran { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 640px;
    margin: 0 auto; padding: calc(var(--vrh) + 10px) 16px calc(var(--dno) + 12px); }
  .vrh { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 15px; color: var(--tekst2); font-weight: 600; }
  .vrh b { color: var(--tekst); }
  .vrh .veza { font-size: 13px; }
  .kartica { background: var(--povrs); border-radius: 18px; box-shadow: var(--senka); padding: 14px 16px; display: flex; flex-direction: column;
    min-height: 0; min-width: 0; overflow: hidden; }
  /* imena se skroluju unutar kartice, a kućica „Primili su“ uvek stoji na dnu */
  .sadrzaj { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; overflow-wrap: anywhere; }
  #gore { flex: 1.35; }
  #dole { flex: 1; }
  .oznaka { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--naslovni); font-weight: 700;
    font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--tekst2); margin-bottom: 6px; }
  .oznaka .koliko { letter-spacing: 0; text-transform: none; font-family: var(--telo); font-weight: 600; }
  .grupa { padding: 6px 0; border-top: 1px solid var(--linija); }
  .grupa:first-of-type { border-top: 0; }
  .grupa .naziv { font-family: var(--naslovni); font-weight: 700; font-size: 24px; line-height: 1.15; }
  .grupa .mesto { font-size: 15px; color: var(--tekst2); margin-top: 1px; }
  .imena { margin: 4px 0 2px; padding: 0; list-style: none; font-size: 18px; line-height: 1.45; }
  #dole .grupa .naziv { font-size: 20px; }
  #dole .imena { font-size: 15px; color: var(--tekst2); }
  .prazno { color: var(--tekst2); font-size: 17px; padding: 18px 0; text-align: center; }
  .primili { position: relative; flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 4px 2px; border-top: 1.5px solid var(--linija); font-weight: 700; font-size: 18px; }
  .primili input { width: 30px; height: 30px; accent-color: var(--ok); flex: none; margin: 0; }
  .primili.trazi { animation: puls .5s ease-in-out 3; }
  @keyframes puls { 50% { background: rgba(174, 82, 36, .25); border-radius: 12px; } }
  .oblacic { position: absolute; left: 0; right: 0; bottom: calc(100% + 4px); background: var(--upozorenje); color: #fff; font-weight: 700;
    font-size: 15px; padding: 9px 12px; border-radius: 10px; }
  .oblacic::after { content: ""; position: absolute; left: 22px; top: 100%; border: 7px solid transparent; border-top-color: var(--upozorenje); }
  .dugmad { display: flex; gap: 10px; }
  .dugme { border-radius: 16px; padding: 18px 14px; font-weight: 800; font-size: 20px; font-family: var(--naslovni); letter-spacing: .04em; }
  .glavno { flex: 1; background: var(--akcent); color: var(--na-akcentu); }
  .nazad { flex: none; width: 64px; background: var(--povrs); border: 1.5px solid var(--linija); font-size: 24px; }
  .podesi { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 15px; color: var(--tekst2); }
  .podesi button { width: 40px; height: 40px; border-radius: 50%; background: var(--povrs); border: 1.5px solid var(--linija); font-size: 20px; font-weight: 700; }
  .podesi b { color: var(--tekst); font-size: 18px; }
  .poruka { text-align: center; font-size: 14px; color: var(--tekst2); min-height: 18px; }
  .prijava { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; text-align: center; }
  .prijava h1 { margin: 0; font-size: 28px; }
  .prijava p { margin: 0; color: var(--tekst2); line-height: 1.45; }
  .prozor { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .prozor-kartica { background: var(--povrs); border-radius: 20px; padding: 20px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .prozor-kartica h2 { margin: 0; font-size: 22px; }
  .prozor-kartica p { margin: 0; line-height: 1.45; color: var(--tekst2); }
  .prozor-kartica .dugme { width: 100%; }
  .obicno { background: transparent; border: 1.5px solid var(--linija); }
</style>
</head>
<body>
<div class="ekran" id="ekran-prijava">
  <div class="prijava">
    <h1>Čitanje na bini</h1>
    <p>Prijavite se Google nalogom kojim skenirate goste. Isti nalog kao u aplikaciji za ulaz.</p>
    <button class="dugme glavno" id="prijavi">Prijavite se</button>
    <div class="poruka" id="prijava-poruka"></div>
  </div>
</div>

<div class="ekran skriveno" id="ekran-rad">
  <div class="vrh"><span id="tura-od"></span><span class="veza" id="veza"></span></div>
  <section class="kartica" id="gore"></section>
  <section class="kartica" id="dole"></section>
  <div class="podesi skriveno" id="podesi">Tura do <button id="manje" aria-label="Manje">−</button><b id="n"></b><button id="vise" aria-label="Više">+</button> ljudi</div>
  <div class="dugmad">
    <button class="dugme nazad" id="nazad" aria-label="Nazad">‹</button>
    <button class="dugme glavno" id="dalje">DALJE ›</button>
  </div>
</div>

<div class="prozor skriveno" id="prozor"><div class="prozor-kartica"><h2 id="prozor-naslov"></h2><p id="prozor-tekst"></p><div id="prozor-dugmad" style="display:flex;flex-direction:column;gap:8px"></div></div></div>

<script>
  const CLIENT_ID = '908081565472-pj7sujfd1tsjrquu9aibvduc20trc7cj.apps.googleusercontent.com';
  const SERVER = 'https://script.google.com/macros/s/AKfycbxS0Yg3IuKoIsEtb6NN7RxHoa3wtHu02Pzms352MdfJn0iRzdNTjfVuOCzQiUBM60u70A/exec';
  const DOZVOLE = ['https://www.googleapis.com/auth/userinfo.email'];
  // Objekat biračkog mesta (kontrolna lista BM), drugi red ispod naziva grupe; u gradu je naziv već objekat
  const OBJEKAT = {"1":"Osnovna škola","2":"Osnovna škola","3":"Osnovna škola","4":"Osnovna škola","5":"Osnovna škola","6":"Osnovna škola","7":"Osnovna škola","8":"Dom kulture","9":"Osnovna škola","10":"Dom kulture","11":"Dom kulture","12":"Dom kulture","13":"Osnovna škola","14":"Dom kulture","15":"Osnovna škola","16":"Dom kulture","17":"Dom kulture","18":"Dom kulture","19":"Dom kulture","20":"Mesna zajednica","21":"Mesna zajednica","22":"Mesna zajednica","23":"Dom kulture","24":"Privatna kuća","25":"Osnovna škola","26":"Osnovna škola","27":"Dom kulture","28":"Osnovna škola","29":"Privatna kuća","30":"Osnovna škola","31":"Dom kulture","32":"Osnovna škola","33":"Dom kulture","34":"Osnovna škola","35":"Osnovna škola","36":"Osnovna škola","37":"Osnovna škola","38":"Crkvena kuća","39":"Osnovna škola","40":"Osnovna škola","41":"Osnovna škola","42":"Osnovna škola","43":"Dom kulture","44":"Osnovna škola","45":"Osnovna škola","46":"Dom kulture","47":"Dom kulture","48":"Osnovna škola","49":"Osnovna škola","50":"Dom kulture","51":"Osnovna škola","52":"Dom kulture","53":"Osnovna škola","54":"Aleksinac","55":"Aleksinac","56":"Aleksinac","57":"Aleksinac","58":"Aleksinac","59":"Aleksinac","60":"Aleksinac","61":"Aleksinac","62":"Aleksinac","63":"Aleksinac","64":"Aleksinac","65":"Aleksinac","66":"Aleksinac","67":"Aleksinac","68":"Aleksinac","69":"Aleksinac","70":"Aleksinac","71":"Aleksinac","72":"Dom kulture","73":"Dom kulture","74":"Dom kulture","75":"Osnovna škola","76":"Dom kulture","77":"Osnovna škola","78":"Osnovna škola","79":"Osnovna škola","80":"Dom kulture","81":"Osnovna škola","82":"Dom kulture","83":"Dom kulture","84":"Osnovna škola","85":"Osnovna škola","86":"Dom kulture","87":"Osnovna škola","88":"Osnovna škola"};

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cuvaj = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const citaj = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };

  // ---------- Prijava (isti ključ kao skener: ko je prijavljen u skeneru, prijavljen je i ovde) ----------
  let token = null, tokenDo = 0, mejl = '', klijent = null;
  const sacuvan = citaj('nova-token');
  if (sacuvan && sacuvan.do > Date.now() + 60000) { token = sacuvan.token; tokenDo = sacuvan.do; mejl = sacuvan.mejl || ''; }
  else mejl = (sacuvan && sacuvan.mejl) || '';

  function traziToken() {
    return new Promise((da, ne) => {
      if (!window.google || !google.accounts) return ne(new Error('Google prijava se još učitava, pokušajte za par sekundi.'));
      klijent = klijent || google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: DOZVOLE.join(' '), callback: () => {} });
      klijent.callback = (o) => {
        if (o.error) return ne(new Error('Prijava nije uspela (' + o.error + ').'));
        token = o.access_token; tokenDo = Date.now() + (Number(o.expires_in) - 60) * 1000;
        cuvaj('nova-token', { token, do: tokenDo, mejl });
        da();
      };
      klijent.error_callback = (e) => ne(new Error('Prijava je prekinuta (' + e.type + ').'));
      klijent.requestAccessToken({ prompt: mejl ? '' : 'select_account', hint: mejl || undefined });
    });
  }

  async function server(akcija, podaci) {
    if (!token || Date.now() > tokenDo) { const e = new Error('Prijava je istekla.'); e.istekla = true; throw e; }
    let r;
    try {
      r = await fetch(SERVER, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ akcija, token }, podaci || {})) });
    } catch (e) { throw new Error('Server ne odgovara (internet?).'); }
    const o = await r.json();
    if (o.greska === 'prijava') { token = null; tokenDo = 0; cuvaj('nova-token', { mejl }); const e = new Error('Prijava je istekla.'); e.istekla = true; throw e; }
    if (o.greska === 'pristup') { const e = new Error('Nalog ' + (o.mejl || '') + ' nema pristup. Javite štabu da ga upiše na list Skeneri.'); e.istekla = true; throw e; }
    if (o.greska === 'server') throw new Error(o.poruka || 'Greška na serveru.');
    if (o.sesija) { token = o.sesija; tokenDo = Date.now() + (Number(o.sesijaTraje) - 60) * 1000; mejl = o.mejl || mejl; cuvaj('nova-token', { token, do: tokenDo, mejl }); }
    return o;
  }

  // ---------- Bina ----------
  let st = null, verzija = 0, radi = false;
  function nazivGrupe(g) { return g || 'Kontrolori bez BM'; }
  function mesto(g) { const m = /^BM (\d+)/.exec(g); return m ? OBJEKAT[Number(m[1])] || '' : ''; }
  function crtajTuru(t, imena) {
    return t.grupe.map((g) => '<div class="grupa"><div class="naziv">' + esc(nazivGrupe(g.naziv)) + '</div>'
      + (mesto(g.naziv) ? '<div class="mesto">' + esc(mesto(g.naziv)) + '</div>' : '')
      + (imena ? '<ul class="imena">' + g.ljudi.map((x) => '<li>' + esc(x.ime) + '</li>').join('') + '</ul>' : '') + '</div>').join('');
  }
  let doleImena = false;
  function crtaj() {
    const b = st;
    $('tura-od').innerHTML = b.pocelo ? 'Tura <b>' + (b.gore ? b.gore.redni : 0) + '</b> od ' + b.ukupno : 'Ukupno tura: <b>' + b.ukupno + '</b>, ljudi ' + b.preostalo;
    $('gore').innerHTML = '<div class="oznaka"><span>Na binu</span>' + (b.gore ? '<span class="koliko">izlazi ' + b.gore.ljudi + '</span>' : '') + '</div>'
      + (b.gore ? '<div class="sadrzaj">' + crtajTuru(b.gore, true) + '</div>'
        + '<label class="primili" id="primili-red"><input type="checkbox" id="primili"' + (b.primili ? ' checked' : '') + '> Primili su zahvalnice</label>'
        : '<div class="prazno">' + (b.pocelo ? (b.dole ? 'Niko nije na bini. Dalje: tura dole ide na binu.' : 'Gotovo. Svi koji su stigli su prozvani.') : 'Kada počnete, ovde je tura koja je na bini.') + '</div>');
    $('dole').innerHTML = '<div class="oznaka"><span>' + (b.pocelo ? 'Neka se spreme' : 'Prva tura') + '</span>' + (b.dole ? '<span class="koliko">' + b.dole.ljudi + ' ljudi · imena ' + (doleImena ? '▴' : '▾') + '</span>' : '') + '</div>'
      + (b.dole ? '<div class="sadrzaj">' + crtajTuru(b.dole, doleImena) + '</div>' : '<div class="prazno">' + (b.preostalo ? '' : 'Nema više nikoga ko je stigao, a nije prozvan.') + '</div>');
    $('dalje').textContent = b.pocelo ? 'DALJE ›' : 'POČNI';
    $('podesi').classList.toggle('skriveno', b.pocelo);
    $('n').textContent = b.n;
    $('nazad').disabled = !b.pocelo;
    $('nazad').style.opacity = b.pocelo ? 1 : .4;
    const cb = $('primili');
    if (cb) cb.addEventListener('change', () => akcija('bina-primili', { vrednost: cb.checked }));
  }
  $('dole').addEventListener('click', () => { doleImena = !doleImena; if (st) crtaj(); });

  async function akcija(a, podaci) {
    if (radi) return;
    radi = true;
    try {
      const o = await server(a, Object.assign({ p: st ? st.p : 0 }, podaci || {}));
      st = o.bina; verzija = o.verzija || verzija;
      crtaj();
      if (o.greska === 'promenjeno') poruka('Neko drugi je već pomerio ture. Ovo je trenutno stanje.');
      if (o.greska === 'primili') trazi();
      if (o.greska === 'prazno') poruka('Još niko nije stigao, a da prima zahvalnicu.');
      $('veza').textContent = '';
    } catch (e) {
      if (e.istekla) return prikaziPrijavu(e.message);
      $('veza').textContent = 'nema veze';
      poruka(e.message);
    } finally { radi = false; }
  }
  function trazi() {
    const red = $('primili-red');
    if (!red) return;
    red.classList.remove('trazi'); void red.offsetWidth; red.classList.add('trazi');
    if (!red.querySelector('.oblacic')) {
      const o = document.createElement('div');
      o.className = 'oblacic'; o.textContent = 'Prvo označite da su primili zahvalnice.';
      red.appendChild(o);
    }
  }
  $('dalje').addEventListener('click', () => {
    if (!st) return;
    if (!st.pocelo) return akcija('bina-pocni');
    if (st.gore && !st.primili) return trazi();  // odmah, bez čekanja servera
    akcija('bina-dalje');
  });
  $('nazad').addEventListener('click', () => {
    if (!st || !st.pocelo) return;
    const tekst = st.gore ? 'Tura ' + st.gore.redni + ' se vraća u „Neka se spreme“' + (st.p >= 2 ? ', a tura ' + (st.gore.redni - 1) + ' ponovo na binu.' : '.')
      : 'Prva tura se vraća, kao da niste počeli.';
    prozor('Vratiti jedan korak?', tekst, [{ tekst: 'Vrati', glavno: true, akcija: () => akcija('bina-nazad') }, { tekst: 'Otkaži' }]);
  });
  $('manje').addEventListener('click', () => akcija('bina-n', { vrednost: st.n - 1 }));
  $('vise').addEventListener('click', () => akcija('bina-n', { vrednost: st.n + 1 }));

  function poruka(t) { prozor('Obaveštenje', esc(t), [{ tekst: 'U redu', glavno: true }]); }
  function prozor(naslov, tekst, dugmad) {
    $('prozor-naslov').textContent = naslov;
    $('prozor-tekst').innerHTML = tekst;
    $('prozor-dugmad').innerHTML = '';
    dugmad.forEach((d) => {
      const b = document.createElement('button');
      b.className = 'dugme ' + (d.glavno ? 'glavno' : 'obicno');
      b.textContent = d.tekst;
      b.addEventListener('click', () => { $('prozor').classList.add('skriveno'); if (d.akcija) d.akcija(); });
      $('prozor-dugmad').appendChild(b);
    });
    $('prozor').classList.remove('skriveno');
  }

  // Na 2 s pita samo verziju (brzo); kad se promeni (skeniranje, neko drugi pritisnuo Dalje), čita ture.
  let pratim = null;
  async function prati() {
    if (radi || document.hidden) return;
    try {
      const o = await server('verzija');
      $('veza').textContent = '';
      if (o.verzija !== verzija) { verzija = o.verzija; const b = await server('bina'); if (!radi) { st = b.bina; crtaj(); } }
    } catch (e) { if (e.istekla) prikaziPrijavu(e.message); else $('veza').textContent = 'nema veze'; }
  }

  function prikaziPrijavu(t) {
    clearInterval(pratim);
    $('ekran-rad').classList.add('skriveno');
    $('ekran-prijava').classList.remove('skriveno');
    $('prijava-poruka').textContent = t || '';
  }
  async function pocni() {
    try {
      const o = await server('bina');
      st = o.bina; verzija = o.verzija;
      $('ekran-prijava').classList.add('skriveno');
      $('ekran-rad').classList.remove('skriveno');
      crtaj();
      clearInterval(pratim);
      pratim = setInterval(prati, 2000);
    } catch (e) { prikaziPrijavu(e.message); }
  }
  $('prijavi').addEventListener('click', () => traziToken().then(pocni).catch((e) => ($('prijava-poruka').textContent = e.message)));
  if (token) pocni();
</script>
</body>
</html>
