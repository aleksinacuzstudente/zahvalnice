<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zahvalnice">
<title>Dodela zahvalnica</title>
<!--
  Dodela zahvalnica, dolazak gostiju: skener se prijavi Google nalogom, kamera čita QR gosta i upis ide pravo u
  Google tabelu (Sheets API, u ime prijavljenog). Upisuje samo nalog sa kojim je tabela podeljena; stranica nema
  podatke, imena se čitaju iz tabele tek posle prijave. Izvor: scripts/zahvalnice/ulaz/ u privatnom repozitorijumu.
-->
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  :root {
    --pozadina: #0B1220; --povrs: #151E2E; --povrs2: #1F2A3D; --tekst: #F8FAFC; --tekst2: #A7B0C0; --linija: #2A364B;
    --ok: #15803D; --ok-tamna: #166534; --lose: #B91C1C; --upozorenje: #B45309; --akcent: #3B82F6;
    --dno: env(safe-area-inset-bottom, 0px); --vrh: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pozadina); color: var(--tekst);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .skriveno { display: none !important; }

  /* Ekran: zaglavlje, kamera, dugmad; sve staje bez skrola */
  .ekran { height: 100dvh; display: flex; flex-direction: column; padding: calc(var(--vrh) + 12px) 16px calc(var(--dno) + 14px); gap: 14px; max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: .01em; }
  header .nalog { font-size: 12px; color: var(--tekst2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60vw; }
  .brojac { text-align: right; }
  .brojac b { display: block; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
  .brojac span { font-size: 12px; color: var(--tekst2); }
  .traka { height: 6px; background: var(--povrs2); border-radius: 3px; overflow: hidden; }
  .traka i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .4s; }

  .sredina { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .kamera { position: relative; width: min(100%, calc(100dvh - 280px)); aspect-ratio: 1 / 1; border-radius: 20px; overflow: hidden; background: var(--povrs); }
  .kamera video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .kamera .nisan { position: absolute; inset: 14%; pointer-events: none; }
  .kamera .nisan::before, .kamera .nisan::after, .kamera .nisan i::before, .kamera .nisan i::after {
    content: ""; position: absolute; width: 34px; height: 34px; border: 5px solid #fff; }
  .kamera .nisan::before { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
  .kamera .nisan::after { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
  .kamera .nisan i::before { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
  .kamera .nisan i::after { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
  .kamera .status { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px; text-align: center; font-size: 15px; font-weight: 600;
    background: linear-gradient(transparent, rgba(0,0,0,.7)); }
  .kamera .pokreni { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: var(--povrs); font-size: 20px; font-weight: 800; }
  .kamera .pokreni svg { width: 64px; height: 64px; }
  .kamera .pokreni small { font-size: 14px; font-weight: 500; color: var(--tekst2); }

  .dugmad { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dugme { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 14px;
    background: var(--povrs2); font-size: 17px; font-weight: 700; }
  .dugme svg { width: 22px; height: 22px; }
  .dugme.glavno { background: var(--akcent); }

  /* Prijava */
  .prijava { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; text-align: center; }
  .prijava .logo { width: 72px; height: 72px; margin: 0 auto; border-radius: 20px; background: var(--povrs2); display: grid; place-items: center; }
  .prijava .logo svg { width: 40px; height: 40px; }
  .prijava h2 { margin: 0; font-size: 26px; }
  .prijava p { margin: 0; color: var(--tekst2); font-size: 16px; line-height: 1.45; }
  .prijava .poruka { color: #FCA5A5; font-weight: 600; }
  .prijava .dugme { font-size: 19px; min-height: 60px; }

  /* Rezultat preko celog ekrana */
  .rezultat { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 32px 24px calc(var(--dno) + 32px); text-align: center; animation: pojava .15s ease-out; }
  .rezultat.ok { background: var(--ok-tamna); }
  .rezultat.lose { background: var(--lose); }
  .rezultat.upozorenje { background: var(--upozorenje); }
  .rezultat svg { width: 96px; height: 96px; }
  .rezultat .naslov { font-size: 22px; font-weight: 800; letter-spacing: .08em; }
  .rezultat .ime { font-size: clamp(32px, 9vw, 48px); font-weight: 800; line-height: 1.1; }
  .rezultat .detalj { font-size: 19px; opacity: .92; line-height: 1.4; }
  .rezultat .dalje { position: absolute; bottom: calc(var(--dno) + 24px); font-size: 15px; opacity: .85; }
  @keyframes pojava { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }

  /* Pretraga: prozor odozdo, skrol samo u listi */
  .zavesa { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); }
  .pretraga { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto; height: 88dvh;
    background: var(--povrs); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; padding: 10px 16px calc(var(--dno) + 10px);
    animation: gore .2s ease-out; }
  @keyframes gore { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .pretraga .rucka { width: 44px; height: 5px; border-radius: 3px; background: var(--linija); margin: 0 auto 10px; }
  .pretraga .vrh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .pretraga .vrh h2 { margin: 0; font-size: 20px; font-weight: 800; }
  .pretraga input { width: 100%; font-size: 18px; padding: 14px; border-radius: 12px; border: 2px solid var(--linija); background: var(--pozadina); color: var(--tekst); outline: none; }
  .pretraga input:focus { border-color: var(--akcent); }
  .pretraga .zatvori { width: 44px; height: 44px; border-radius: 50%; background: var(--povrs2); display: grid; place-items: center; }
  .pretraga .zatvori svg { width: 22px; height: 22px; }
  .pretraga ul { list-style: none; margin: 10px 0 0; padding: 0; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  .pretraga li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 2px; border-bottom: 1px solid var(--linija); }
  .pretraga .ko { font-size: 17px; font-weight: 700; }
  .pretraga .sta { font-size: 13px; color: var(--tekst2); margin-top: 2px; }
  .pretraga li button { padding: 12px 16px; border-radius: 10px; background: var(--ok); font-weight: 800; white-space: nowrap; }
  .pretraga .usao { color: #FCA5A5; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .pretraga .napomena { color: var(--tekst2); text-align: center; padding: 20px 0; font-size: 15px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-qr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6h-6z"/><path d="M14 4h6v6h-6z"/><path d="M4 14h6v6h-6z"/><path d="M14 14h2v2h-2z"/><path d="M18 18h2v2h-2z"/><path d="M14 18h2v2h-2z"/><path d="M18 14h2v2h-2z"/></symbol>
  <symbol id="i-kamera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h1a2 2 0 0 0 2 -2a1 1 0 0 1 1 -1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2"/><path d="M9 13a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></symbol>
  <symbol id="i-trazi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M9 12l2 2l4 -4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M10 10l4 4m0 -4l-4 4"/></symbol>
  <symbol id="i-zatvori" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></symbol>
  <symbol id="i-pazi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0z"/><path d="M12 16h.01"/></symbol>
</svg>

<div class="ekran" id="ekran-prijava">
  <div class="prijava">
    <div class="logo"><svg><use href="#i-qr"/></svg></div>
    <h2>Dolazak gostiju</h2>
    <p>Dodela zahvalnica. Prijavite se Google nalogom sa kojim je podeljena tabela gostiju.</p>
    <p class="poruka" id="prijava-poruka"></p>
    <button class="dugme glavno" id="prijavi">Prijavite se</button>
  </div>
</div>

<div class="ekran skriveno" id="ekran-rad">
  <header>
    <div>
      <h1>Dolazak gostiju</h1>
      <div class="nalog" id="nalog"></div>
    </div>
    <div class="brojac"><b id="stiglo">0</b><span id="od">od 0</span></div>
  </header>
  <div class="traka"><i id="traka"></i></div>
  <div class="sredina">
    <div class="kamera" id="kamera">
      <video id="video" playsinline muted></video>
      <div class="nisan"><i></i></div>
      <div class="status" id="status">Usmerite kameru na QR kod</div>
      <button class="pokreni" id="pokreni"><svg><use href="#i-kamera"/></svg>Dodirnite za skeniranje<small>Kamera ostaje upaljena</small></button>
    </div>
  </div>
  <div class="dugmad">
    <button class="dugme" id="otvori-pretragu"><svg><use href="#i-trazi"/></svg>Pretraga</button>
    <label class="dugme" for="slika"><svg><use href="#i-kamera"/></svg>Slikaj QR</label>
    <input id="slika" class="skriveno" type="file" accept="image/*" capture="environment">
  </div>
</div>

<div class="zavesa skriveno" id="zavesa"></div>
<div class="pretraga skriveno" id="pretraga" role="dialog" aria-label="Pretraga gostiju">
  <div class="rucka"></div>
  <div class="vrh">
    <h2>Pretraga gosta</h2>
    <button class="zatvori" id="zatvori-pretragu" aria-label="Zatvori"><svg><use href="#i-zatvori"/></svg></button>
  </div>
  <input id="q" type="search" autocomplete="off" autocapitalize="off" enterkeyhint="search" placeholder="Ime, broj ili telefon">
  <ul id="lista"></ul>
</div>

<div class="rezultat skriveno" id="rezultat" role="alert"></div>
<canvas id="platno" class="skriveno"></canvas>

<script>
  const CLIENT_ID = '908081565472-pj7sujfd1tsjrquu9aibvduc20trc7cj.apps.googleusercontent.com';
  const TABELA = '1iyR-gLOteQkBjGUQCXHB1HW9RNwrKoalVgEL62nbYpE';
  const SHEET = 'Gosti';
  const SCOPE = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email';
  const API = 'https://sheets.googleapis.com/v4/spreadsheets/' + TABELA + '/values/';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ime = (g) => esc(g.ime + ' ' + g.prezime);
  const kodIzUrla = new URLSearchParams(location.search).get('k');

  // ---------- Prijava (Google Identity Services, token u ime skenera) ----------
  let token = null, tokenDo = 0, mejl = '', klijent = null, cekaju = [];
  try {
    const t = JSON.parse(sessionStorage.getItem('ulaz-token') || 'null');
    if (t && t.do > Date.now() + 60000) { token = t.token; tokenDo = t.do; mejl = t.mejl || ''; }
  } catch (e) {}

  function napraviKlijenta() {
    if (klijent || !window.google || !google.accounts) return klijent;
    klijent = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPE,
      callback: async (odg) => {
        const c = cekaju; cekaju = [];
        if (odg.error || !google.accounts.oauth2.hasGrantedAllScopes(odg, ...SCOPE.split(' '))) {
          c.forEach(([, ne]) => ne(new Error('Niste odobrili sve dozvole. Prijavite se ponovo i štiklirajte sve.')));
          return;
        }
        token = odg.access_token; tokenDo = Date.now() + (odg.expires_in - 60) * 1000;
        try { mejl = (await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + token } })).json()).email || ''; } catch (e) {}
        try { sessionStorage.setItem('ulaz-token', JSON.stringify({ token, do: tokenDo, mejl })); } catch (e) {}
        c.forEach(([da]) => da(token));
      },
      error_callback: (e) => { const c = cekaju; cekaju = []; c.forEach(([, ne]) => ne(new Error('Prijava nije uspela (' + (e.type || e) + ').'))); },
    });
    return klijent;
  }
  function traziToken(prompt) {
    return new Promise((da, ne) => {
      if (!napraviKlijenta()) return ne(new Error('Google prijava se još učitava, pokušajte ponovo.'));
      cekaju.push([da, ne]);
      klijent.requestAccessToken({ prompt, hint: mejl || undefined });
    });
  }
  async function tokenSad() {
    if (token && Date.now() < tokenDo) return token;
    return traziToken('');
  }

  // ---------- Tabela ----------
  async function sheets(metod, putanja, telo) {
    const t = await tokenSad();
    const r = await fetch(API + putanja, {
      method: metod, headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' },
      body: telo ? JSON.stringify(telo) : undefined,
    });
    if (r.status === 401) { token = null; return sheets(metod, putanja, telo); }
    if (r.status === 403 || r.status === 404) { const e = new Error('PRISTUP'); e.pristup = true; throw e; }
    if (!r.ok) throw new Error('Tabela: greška ' + r.status);
    return r.json();
  }

  let gosti = [], k = {};
  async function ucitaj() {
    const v = (await sheets('GET', encodeURIComponent(SHEET + '!A1:J'))).values || [];
    k = {}; (v[0] || []).forEach((h, i) => (k[h] = i));
    gosti = v.slice(1).map((r, i) => ({
      red: i + 2, broj: r[k.Broj] || '', kod: String(r[k.Kod] || '').trim().toUpperCase(), ime: r[k.Ime] || '', prezime: r[k.Prezime] || '',
      telefon: r[k.Telefon] || '', uloga: r[k.Uloga] || '', stigao: r[k.Stigao] || '', vreme: r[k.Vreme] || '', upisao: r[k.Upisao] || '',
    })).filter((g) => g.broj);
    stanje();
  }
  function stanje() {
    const s = gosti.filter((g) => g.stigao).length;
    $('stiglo').textContent = s;
    $('od').textContent = 'od ' + gosti.length;
    $('traka').style.width = (gosti.length ? (100 * s / gosti.length) : 0) + '%';
  }
  const slovo = (c) => String.fromCharCode(65 + c);

  // Upis: uvek sveže čitanje tabele pre upisa (drugi skener je možda upravo upisao istog gosta).
  let salje = false;
  async function upisi(po, vrednost) {
    if (salje) return;
    salje = true;
    $('status').textContent = 'Upisujem…';
    try {
      await ucitaj();
      const g = gosti.find((x) => (po === 'kod' ? x.kod === vrednost : x.broj === vrednost));
      if (!g) return prikazi({ status: 'nema', trazeno: vrednost });
      if (g.stigao) return prikazi({ status: 'vec', gost: g });
      const vreme = new Date().toLocaleTimeString('sr-RS', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Belgrade' });
      const opseg = SHEET + '!' + slovo(k.Stigao) + g.red + ':' + slovo(k.Upisao) + g.red;
      await sheets('PUT', encodeURIComponent(opseg) + '?valueInputOption=RAW', { values: [['DA', vreme, mejl]] });
      Object.assign(g, { stigao: 'DA', vreme, upisao: mejl });
      stanje();
      prikazi({ status: 'ok', gost: g });
    } catch (e) {
      prikazi(e.pristup ? { status: 'pristup' } : { status: 'greska', poruka: e.message });
    } finally {
      salje = false;
      $('status').textContent = 'Usmerite kameru na QR kod';
    }
  }

  // ---------- Rezultat preko celog ekrana ----------
  let zvuk, tajmerRezultata = null, rezultatOtvoren = false;
  function ton(ok) {
    try {
      zvuk = zvuk || new (window.AudioContext || window.webkitAudioContext)();
      const tonovi = ok ? [[880, 0, 0.15]] : [[220, 0, 0.18], [220, 0.25, 0.18]];
      tonovi.forEach(([f, od, traje]) => {
        const o = zvuk.createOscillator(), g = zvuk.createGain();
        o.frequency.value = f; o.connect(g); g.connect(zvuk.destination);
        g.gain.value = 0.25; o.start(zvuk.currentTime + od); o.stop(zvuk.currentTime + od + traje);
      });
      if (navigator.vibrate) navigator.vibrate(ok ? 80 : [120, 80, 120]);
    } catch (e) {}
  }
  function prikazi(r) {
    const el = $('rezultat');
    const ikona = (id) => '<svg><use href="#' + id + '"/></svg>';
    let klasa = 'lose', html = '';
    if (r.status === 'ok') {
      klasa = 'ok';
      html = ikona('i-ok') + '<div class="naslov">UPISAN</div><div class="ime">' + ime(r.gost) + '</div>'
        + '<div class="detalj">' + esc(r.gost.uloga) + ' · broj ' + esc(r.gost.broj) + '</div>';
    } else if (r.status === 'vec') {
      html = ikona('i-x') + '<div class="naslov">VEĆ UŠAO</div><div class="ime">' + ime(r.gost) + '</div>'
        + '<div class="detalj">u ' + esc(r.gost.vreme) + '<br>upisao ' + esc(r.gost.upisao) + '</div>';
    } else if (r.status === 'nema') {
      klasa = 'upozorenje';
      html = ikona('i-pazi') + '<div class="naslov">NEMA NA SPISKU</div><div class="detalj">Kod ' + esc(r.trazeno)
        + ' nije na spisku.<br>Potražite gosta po imenu.</div>';
    } else if (r.status === 'pristup') {
      html = ikona('i-x') + '<div class="naslov">NEMATE PRISTUP</div><div class="detalj">Nalog ' + esc(mejl)
        + ' nema pravo na tabelu gostiju.<br>Javite štabu ovaj mejl.</div>';
    } else {
      klasa = 'upozorenje';
      html = ikona('i-pazi') + '<div class="naslov">NIJE UPISANO</div><div class="detalj">' + esc(r.poruka) + '</div>';
    }
    html += '<div class="dalje">' + (klasa === 'ok' ? 'Sledeći gost…' : 'Dodirnite za nastavak') + '</div>';
    el.className = 'rezultat ' + klasa;
    el.innerHTML = html;
    rezultatOtvoren = true;
    ton(klasa === 'ok');
    clearTimeout(tajmerRezultata);
    if (klasa === 'ok') tajmerRezultata = setTimeout(zatvoriRezultat, 1800);
  }
  function zatvoriRezultat() {
    clearTimeout(tajmerRezultata);
    $('rezultat').className = 'rezultat skriveno';
    rezultatOtvoren = false;
    poslednjiU = Date.now();  // isti QR koji je još ispred kamere ne upisuje se odmah ponovo
  }
  $('rezultat').addEventListener('click', zatvoriRezultat);

  // ---------- Kamera ----------
  let poslednji = '', poslednjiU = 0;
  function procitan(tekst) {
    const m = String(tekst).match(/[?&]k=([A-Za-z0-9]+)/);
    const kod = (m ? m[1] : String(tekst)).trim().toUpperCase();
    const sad = Date.now();
    if (salje || rezultatOtvoren || (kod === poslednji && sad - poslednjiU < 4000)) return;
    poslednji = kod; poslednjiU = sad;
    upisi('kod', kod);
  }
  let tok = null, detektor = null;
  const video = $('video'), platno = $('platno'), ctx = platno.getContext('2d', { willReadFrequently: true });
  async function kadar() {
    if (!tok) return;
    if (video.readyState >= 2 && !salje && !rezultatOtvoren) {
      try {
        if (detektor) {
          const kodovi = await detektor.detect(video);
          if (kodovi.length) procitan(kodovi[0].rawValue);
        } else {
          const w = 640, h = Math.round(video.videoHeight * w / video.videoWidth) || 480;
          platno.width = w; platno.height = h;
          ctx.drawImage(video, 0, 0, w, h);
          const qr = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
          if (qr && qr.data) procitan(qr.data);
        }
      } catch (e) {}
    }
    setTimeout(() => requestAnimationFrame(kadar), 120);
  }
  async function ukljuci() {
    try { zvuk = zvuk || new (window.AudioContext || window.webkitAudioContext)(); zvuk.resume(); } catch (e) {}
    try {
      if ('BarcodeDetector' in window) {
        try { if ((await BarcodeDetector.getSupportedFormats()).includes('qr_code')) detektor = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {}
      }
      tok = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
      video.srcObject = tok;
      await video.play();
      $('pokreni').classList.add('skriveno');
      kadar();
    } catch (e) {
      tok = null;
      prikazi({ status: 'greska', poruka: 'Kamera ne radi (' + (e.name || e) + '). Dozvolite kameru u podešavanjima pregledača ili koristite Slikaj QR.' });
    }
  }
  $('pokreni').addEventListener('click', ukljuci);
  document.addEventListener('visibilitychange', () => {
    // telefon ugasi kameru kad se ekran zaključa; posle povratka dugme je opet tu
    if (document.hidden && tok) { tok.getTracks().forEach((t) => t.stop()); tok = null; $('pokreni').classList.remove('skriveno'); }
  });
  $('slika').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => {
      const w = Math.min(1200, img.width), h = Math.round(img.height * w / img.width);
      platno.width = w; platno.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      const qr = jsQR(ctx.getImageData(0, 0, w, h).data, w, h);
      URL.revokeObjectURL(img.src);
      e.target.value = '';
      if (qr && qr.data) { poslednji = ''; procitan(qr.data); }
      else prikazi({ status: 'greska', poruka: 'Na slici nije pronađen QR kod. Slikajte bliže i oštrije.' });
    };
    img.src = URL.createObjectURL(f);
  });

  // ---------- Pretraga ----------
  const bezKvacica = (s) => String(s).toLowerCase().replace(/dž/g, 'dz').replace(/đ/g, 'dj').normalize('NFD').replace(/[̀-ͯ]/g, '');
  function trazi() {
    const upit = bezKvacica($('q').value).trim();
    const cifre = upit.replace(/\D/g, '');
    const reci = upit.split(/\s+/);
    const nadjeni = !upit ? [] : gosti.filter((g) => {
      if (/^\d+$/.test(upit) && upit.length <= 4) return g.broj === upit;
      if (cifre.length >= 5) return g.telefon.replace(/\D/g, '').includes(cifre);
      const ip = bezKvacica(g.ime + ' ' + g.prezime);
      return reci.every((w) => ip.includes(w));
    });
    let html = nadjeni.slice(0, 40).map((g) => '<li><div><div class="ko">' + ime(g) + '</div><div class="sta">broj ' + esc(g.broj)
      + ' · ' + esc(g.uloga) + (g.telefon ? ' · ' + esc(g.telefon) : '') + '</div></div>'
      + (g.stigao ? '<span class="usao">ušao ' + esc(g.vreme) + '</span>' : '<button data-broj="' + esc(g.broj) + '">UPIŠI</button>') + '</li>').join('');
    if (!upit) html = '<li class="napomena">Upišite ime, broj gosta ili telefon.</li>';
    else if (!nadjeni.length) html = '<li class="napomena">Nema takvog gosta.</li>';
    else if (nadjeni.length > 40) html += '<li class="napomena">Ima još, upišite više slova.</li>';
    $('lista').innerHTML = html;
  }
  function otvoriPretragu() {
    $('zavesa').classList.remove('skriveno'); $('pretraga').classList.remove('skriveno');
    trazi(); setTimeout(() => $('q').focus(), 50);
  }
  function zatvoriPretragu() {
    $('zavesa').classList.add('skriveno'); $('pretraga').classList.add('skriveno');
    $('q').blur();
  }
  $('otvori-pretragu').addEventListener('click', otvoriPretragu);
  $('zatvori-pretragu').addEventListener('click', zatvoriPretragu);
  $('zavesa').addEventListener('click', zatvoriPretragu);
  $('q').addEventListener('input', trazi);
  $('lista').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-broj]');
    if (!b) return;
    b.disabled = true;
    zatvoriPretragu();
    $('q').value = '';
    upisi('broj', b.dataset.broj);
  });

  // ---------- Početak ----------
  async function pocni() {
    try {
      await ucitaj();
      $('nalog').textContent = mejl;
      $('ekran-prijava').classList.add('skriveno');
      $('ekran-rad').classList.remove('skriveno');
      if (kodIzUrla) { history.replaceState(null, '', location.pathname); procitan(kodIzUrla); }
      setInterval(() => { if (!salje) ucitaj().catch(() => {}); }, 30000);
    } catch (e) {
      $('prijava-poruka').textContent = e.pristup
        ? 'Nalog ' + (mejl || 'nepoznat') + ' nema pristup tabeli gostiju. Javite štabu ovaj mejl.'
        : e.message;
    }
  }
  $('prijavi').addEventListener('click', () => {
    $('prijava-poruka').textContent = '';
    traziToken(token ? '' : 'consent').then(pocni).catch((e) => { $('prijava-poruka').textContent = e.message; });
  });
  if (token) pocni();
  else if (kodIzUrla) $('prijava-poruka').textContent = 'Prijavite se, pa se gost upisuje sam.';
</script>
</body>
